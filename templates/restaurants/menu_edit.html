{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h3>✏ Edit Menu Item</h3>

    <form method="POST">
        {% csrf_token %}

        <label class="mt-3">Name:</label>
        <input type="text" name="name" value="{{ menu.name }}" class="form-control">

        <label class="mt-3">Price:</label>
        <input type="number" step="0.01" name="price" value="{{ menu.price }}" class="form-control">

        <label class="mt-3">Description:</label>
        <textarea name="description" class="form-control">{{ menu.description }}</textarea>

        <label class="mt-3">Available:</label>
        <input type="checkbox" name="is_available" {% if menu.is_available %}checked{% endif %}>

        <label>Stok</label>
        <input type="number" name="stock" value="{{ menu.stock }}" min="0">


        <button class="btn btn-primary mt-4">Update</button>
    </form>

</div>

{% endblock %}
